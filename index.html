<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGD Class Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#6fcaf0;--sky2:#bfe9fb;--block:#ffcc33;--block-edge:#c98a00;--ink:#2b1a0e;--brick:#d9432f;--grass:#46b04a;--dirt:#b8743c;--paper:#fff;--text:#20160c;--focus:#1b3fd1}
@media (prefers-color-scheme:dark){:root{--sky:#1b2556;--sky2:#2c3a7a;--paper:#1f2748;--text:#fff;--focus:#ffd84d}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;font:400 1.15rem/1.45 Nunito,"Segoe UI",system-ui,sans-serif;color:var(--text);background:linear-gradient(var(--sky2),var(--sky) 320px) fixed,var(--sky)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 120px}
h1{font:400 clamp(2.4rem,7vw,4.6rem)/1 Bungee,Impact,"Arial Black",sans-serif;margin:0;color:var(--block);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.sub{margin:14px 0 0;font-weight:800;font-size:1.25rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:26px 0 0;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:14px 16px 14px 62px;position:relative;font-weight:700}
.how li::before{content:counter(s);position:absolute;left:14px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--brick);color:#fff;font:400 1.2rem/36px Bungee,sans-serif;text-align:center;border:3px solid var(--ink)}
.note{margin:12px 0 0;font-weight:700;opacity:.85}
h2{font:400 1.6rem Bungee,Impact,sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);margin:34px 0 14px}
/* featured demo */
.feature{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;background:var(--paper);border:4px solid var(--ink);border-radius:16px;padding:20px;box-shadow:0 6px 0 var(--ink)}
@media (max-width:760px){.feature{grid-template-columns:1fr}}
.tag{display:inline-block;font:800 .9rem Nunito,sans-serif;background:var(--grass);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;margin-bottom:8px}
.feature h3{font:400 clamp(1.5rem,3.5vw,2rem)/1.1 Bungee,Impact,sans-serif;margin:0 0 10px}
.feature p{margin:0 0 12px}
.feature .meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.feature .meta li{font-weight:800;font-size:.95rem;border:3px solid var(--ink);border-radius:8px;padding:2px 10px;background:#fff6d6;color:#20160c}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.controls{background:#fff6d6;color:#20160c;border:3px solid var(--ink);border-radius:12px;padding:14px 16px}
.controls h4{font:400 1.1rem Bungee,Impact,sans-serif;margin:0 0 8px}
.controls dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-weight:700}
.controls dt{font:800 .95rem ui-monospace,Menlo,monospace;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 8px;text-align:center;align-self:start}
.controls dd{margin:0}
.controls .hint{margin:12px 0 0;font-size:1rem}
/* student grid */
.find{display:block;width:100%;max-width:520px;margin:6px 0 12px;font:800 1.25rem Nunito,sans-serif;padding:14px 18px;border:4px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--text)}
.bar{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:800 1rem Nunito,sans-serif;padding:8px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brick);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.lvl{text-decoration:none;text-align:left;cursor:pointer;border:4px solid var(--ink);border-radius:12px;background:var(--block);color:#20160c;padding:16px;min-height:120px;font-family:inherit;box-shadow:inset 0 -6px 0 var(--block-edge),0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;gap:6px}
.lvl:hover{transform:translateY(-2px);box-shadow:inset 0 -6px 0 var(--block-edge),0 8px 0 var(--ink)}
.lvl:active{transform:translateY(5px);box-shadow:inset 0 -6px 0 var(--block-edge),0 1px 0 var(--ink)}
.lvl .nm{font:400 1.4rem/1.1 Bungee,Impact,sans-serif}
.lvl .tt{font-weight:700;font-size:1rem;opacity:.85}
.lvl .go{margin-top:auto;align-self:flex-start;font-weight:800;font-size:1rem;background:var(--brick);color:#fff;border:3px solid var(--ink);border-radius:8px;padding:3px 12px}
.lvl.done{background:var(--grass);color:#fff;box-shadow:inset 0 -6px 0 #2e7d32,0 6px 0 var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.empty{background:var(--paper);border:4px dashed var(--ink);border-radius:14px;padding:24px;font-weight:700;max-width:620px}
.updated{margin-top:40px;font-weight:700;opacity:.8}
.ground{position:fixed;left:0;right:0;bottom:0;height:34px;border-top:4px solid var(--ink);background:linear-gradient(var(--grass) 0 10px,transparent 10px),repeating-conic-gradient(var(--dirt) 0 25%,#a0622e 0 50%) 0 10px/24px 24px}
.modal{position:fixed;inset:0;background:rgba(20,12,4,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.open{display:flex}
.box{background:#fff;color:#20160c;border:4px solid var(--ink);border-radius:16px;padding:24px;max-width:540px;width:100%;max-height:92vh;overflow:auto}
.box h3{font:400 1.5rem/1.15 Bungee,Impact,sans-serif;margin:0 0 12px}
.box p{margin:0 0 14px;font-size:1.15rem}
.box .steps{background:#fff6d6;border:3px solid var(--ink);border-radius:10px;padding:12px 14px 12px 40px;font-weight:700;margin:0 0 14px}
.box .steps li{margin:4px 0}
.box textarea{width:100%;height:130px;font:600 .85rem ui-monospace,Menlo,monospace;border:3px solid var(--ink);border-radius:8px;padding:8px;margin-bottom:14px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.btn{font:800 1.15rem Nunito,sans-serif;padding:12px 20px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:#20160c;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--ink);display:inline-block}
.btn.big{background:var(--brick);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// Students whose game lives somewhere else (like Bloxels). Clicking opens the link directly.
// Example: { name: 'Kaylena S.', period: '1st', title: '', url: 'https://...' }
const LINK_LEVELS = [];
/* ================================= */

let DATA = { updated: null, levels: [] };
let status = 'loading';
const ORDER = ['1st','2nd','3rd','4th','5th','6th','7th'];
let levels = [], periods = [];
function setData(d){
  DATA = d || { updated:null, levels:[] };
  const isUrl = s => /^https?:\/\/\S+$/i.test(String(s||'').trim());
  const links = LINK_LEVELS.filter(l=>isUrl(l.url));
  const fed = (DATA.levels||[]).map(l=>isUrl(l.code)?Object.assign({},l,{url:l.code.trim()}):l);
  levels = fed.concat(links).map((l,i)=>Object.assign({i},l));
  periods = [...new Set(levels.map(l=>l.period))]
    .sort((a,b)=>(ORDER.indexOf(a)+1||99)-(ORDER.indexOf(b)+1||99));
}
let period='All', query='';
const played=new Set();
let demoPlayed=false;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const firstName=n=>String(n).split(' ')[0];
const stepsHTML=()=>PASTE_STEPS.length?`<p style="margin-bottom:6px"><b>In the game tab:</b></p><ol class="steps">${PASTE_STEPS.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'';

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}
function download(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

function block(l){
  if(l.url){
    const label = /bloxels/i.test(l.url) ? 'Play in Bloxels' : 'Open game';
    return `<a class="lvl ${played.has(l.i)?'done':''}" href="${esc(l.url)}" target="_blank" rel="noopener" data-link="${l.i}">
      <span class="nm">${esc(l.name)}</span>${l.title?`<span class="tt">${esc(l.title)}</span>`:''}
      <span class="go">${label}</span></a>`;
  }
  return `<button class="lvl ${played.has(l.i)?'done':''}" data-i="${l.i}">
    <span class="nm">${esc(l.name)}</span>${l.title?`<span class="tt">${esc(l.title)}</span>`:''}
    <span class="go">${played.has(l.i)?'Play again':'Play'}</span></button>`;
}

function featureHTML(){
  return `<h2>Featured level</h2>
  <section class="feature" aria-labelledby="fh">
    <div>
      <span class="tag">Teacher demo</span>
      <h3 id="fh">${esc(DEMO.name)}</h3>
      <p>${esc(DEMO.blurb)}</p>
      <ul class="meta">${DEMO.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
      <div class="btns">
        <button class="btn big" data-demo="play">${demoPlayed?'Play again':'Play the demo'}</button>
        <button class="btn" data-demo="file">Download level file</button>
      </div>
      <p class="note">${esc(DEMO.by)}</p>
    </div>
    <div class="controls">
      <h4>Key tips</h4>
      <dl>
        <dt>RUN</dt><dd>Hold it to pick up and carry a key.</dd>
        <dt>UP</dt><dd>Press it at a door to unlock it. Also talks to Toads.</dd>
        <dt>JUMP</dt><dd>Stomp bosses 3 times. Watch out for fire!</dd>
      </dl>
      <p class="hint"><b>Lost your key?</b> Look for a Toad with a spare.</p>
    </div>
  </section>`;
}

function studentsHTML(){
  if(status==='loading') return '<p class="empty">Loading student levels...</p>';
  if(status==='error' || !levels.length) return '<p class="empty">Student levels are coming soon. Play the demo above while you wait!</p>';
  const q=query.trim().toLowerCase();
  const match=l=>!q||(l.name+' '+(l.title||'')).toLowerCase().includes(q);
  const groups=(period==='All'?periods:[period]).map(p=>{
    const list=levels.filter(l=>l.period===p&&match(l)).sort((a,b)=>a.name.localeCompare(b.name));
    return list.length?`<section><h2>${esc(p)} period</h2><div class="grid">${list.map(block).join('')}</div></section>`:'';
  }).join('');
  return `<input class="find" type="search" placeholder="Type a student's first name" aria-label="Type a student's first name" value="${esc(query)}">
    ${periods.length>1?`<div class="bar" role="toolbar" aria-label="Show one class period">
      ${['All',...periods].map(p=>`<button class="chip" data-p="${esc(p)}" aria-pressed="${p===period}">${p==='All'?'All classes':esc(p)+' period'}</button>`).join('')}
    </div>`:''}
    ${groups||'<p class="empty" style="margin-top:20px">No one by that name yet. Check the spelling, or try just the first few letters.</p>'}`;
}

function render(){
  const upd=DATA.updated?new Date(DATA.updated).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):null;
  document.getElementById('app').innerHTML=`<div class="wrap">
    <h1>Class Arcade</h1>
    <p class="sub">Super Mario Construct levels made by View Ridge Video Game Design students.</p>
    <ol class="how">
      <li>Pick a level and click Play.</li>
      <li>The level code copies for you.</li>
      <li>Open the game, then paste the code. That's it!</li>
    </ol>
    <p class="note">Works best on a laptop or desktop computer with a keyboard.</p>
    ${featureHTML()}
    <h2>Student levels</h2>
    ${studentsHTML()}
    ${upd?`<p class="updated">Last updated ${esc(upd)}.</p>`:''}
  </div>`;
}

function openModal(html){
  document.getElementById('box').innerHTML=html;
  document.getElementById('modal').classList.add('open');
  (document.querySelector('#box [data-focus]')||document.querySelector('#box button')).focus();
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

async function play(l){
  const ok=await copyText(l.code);
  const who=l.isDemo?'The demo':esc(firstName(l.name))+"'s";
  const openBtn=GAME_URL?`<a class="btn big" href="${esc(GAME_URL)}" target="_blank" rel="noopener" data-focus data-act="opened">Open the game</a>`:'';
  if(ok){
    openModal(`<h3 id="mh">${who} level is copied!</h3>
      <p>${GAME_URL?'Click <b>Open the game</b> below. It opens in a new tab.':'Open Super Mario Construct.'}</p>
      ${stepsHTML()}
      <p>To play another level, come back to this tab.</p>
      <div class="actions"><button class="btn" data-act="close">Close</button>${openBtn}</div>`);
  }else{
    openModal(`<h3 id="mh">One extra step</h3>
      <p>This computer didn't let us copy automatically. The code below is already selected. Press <b>Ctrl+C</b> (on a Mac, <b>Cmd+C</b>) to copy it.</p>
      <textarea readonly>${esc(l.code)}</textarea>
      ${stepsHTML()}
      <div class="actions"><button class="btn" data-act="close">Close</button>${openBtn}</div>`);
    const ta=document.querySelector('#box textarea'); ta.focus(); ta.select();
  }
}

document.addEventListener('click',e=>{
  const link=e.target.closest('a[data-link]');
  if(link){ played.add(+link.dataset.link); setTimeout(render,100); return; }
  const act=e.target.closest('[data-act]');
  if(act){ if(act.dataset.act==='close'||act.dataset.act==='opened') setTimeout(closeModal,50); return; }
  if(e.target.id==='modal'){ closeModal(); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.demo==='play'){ demoPlayed=true; render(); play({code:DEMO.code,isDemo:true}); return; }
  if(b.dataset.demo==='file'){ download(DEMO.file,DEMO.code); return; }
  if(b.dataset.p){ period=b.dataset.p; render(); return; }
  if(b.dataset.i!==undefined){ const l=levels[+b.dataset.i]; played.add(l.i); render(); play(l); }
});
document.addEventListener('input',e=>{
  if(!e.target.classList.contains('find')) return;
  query=e.target.value; const pos=e.target.selectionStart; render();
  const s=document.querySelector('.find'); s.focus(); s.setSelectionRange(pos,pos);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
render();
fetch(API_URL + '?t=' + Date.now(), { cache: 'no-store' })
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ setData(d); status='ready'; render(); })
  .catch(()=>{ setData(null); status='error'; render(); });
</script>
</body>
</html>
